<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Movie Finder</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- CSS -->
   <link rel="stylesheet" href="./CSS/base.css">
<link rel="stylesheet" href="./CSS/buttons.css">
<link rel="stylesheet" href="./CSS/card.css">
<link rel="stylesheet" href="./CSS/header.css">
<link rel="stylesheet" href="./CSS/responsive.css">
<link rel="stylesheet" href="./CSS/search-box.css">
<link rel="stylesheet" href="./CSS/suggestions_box.css">
<link rel="stylesheet" href="./CSS/modal.css">
    <!-- JS -->
    <script type="module" src="./script.js"></script>
    <!-- alert widget -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div id="movieModal"></div>
    <header>
        <h1>🎬 Movie Finder</h1>
    </header>
    <section class="search-box">
    <input type="text" id="searchInput" placeholder="Enter the movie title...">
    <div id="suggestions" class="suggestions-box"></div>
    <button id="searchBtn">Search</button>
    <button id="favoritesBtn" class="favorites-header-btn">
    ❤️ My Favorites
</button>
<button id="clearFavoritesBtn">
    🗑 Clear your selection
</button>
<button id="homeBtn"
        style="display:none;">
    🏠 Home
</button>
</section>


    <section id="results" class="results"></section>
<div class="load-more-container">
    <button id="loadMoreBtn" class="load-more-btn">
        Show more
    </button>
</div>
</body>
</html>
